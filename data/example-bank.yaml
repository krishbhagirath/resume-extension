# Example experience bank (copy to data/experiences.yaml and make it yours).
# Krish's experience bank. Everything goes here; each resume picks what fits the job.
#
# Sources: your 4 resumes (General, AI, DL, Embedded) come first, word for word.
# Ids ending in -site are details from krishbhagirath.com that aren't on any resume.
# Ids ending in -alt are alternate wordings (alt_of says of which bullet): Claude may
# pick one instead of the main version, never both, and they never fill space.
#
# Formatting: bullets are LaTeX (latex_bullets: true). \textbf{bold}, \% for %,
# \$ for $, $\times$ for x, \& for &. Keep bullets in 'single quotes' ('' = apostrophe).
# overlaps: an experience and a project about the same work. Only one gets picked.

profile:
  first_name: Krish
  last_name: Bhagirath
  email: you@example.com
  location: Hamilton, ON
  links:
    - label: linkedin.com/in/krishbhagirath
