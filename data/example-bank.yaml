      icon: faGlobe

settings:
  template: jakes
  latex_bullets: true
  max_experiences: 4
  max_projects: 4
  max_bullets_per_item: 5
  min_bullets_per_item: 2
  keep_bank_order: experiences   # jobs print in the order below; projects print most relevant first
  strict_lines: true             # never print a bullet that leaves a word or two on its own line

